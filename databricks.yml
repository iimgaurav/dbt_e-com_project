bundle:
  name: sales_analytics

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog used by the job
    default: dbt_prod
  schema:
    default: analytics
  warehouse_id:
    description: Serverless SQL warehouse used to run dbt
    default: faced73bbff7e9f2

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

targets:
  dev:
    default: true
    variables:
      catalog: dbt

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbt_prod
