name: 'sales_analytics'
version: '1.1.0'
config-version: 2

profile: 'sales_analytics'

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

vars:
  # Unity Catalog volume holding the raw CSVs (override per environment)
  raw_volume_path: "{{ env_var('DBT_RAW_VOLUME_PATH', '/Volumes/dbt/raw/sales_analytics_raw') }}"
  # Re-read this many days before the target watermark on every incremental run
  late_arriving_lookback_days: 3
  # Table-based audit log location (see macros/observability.sql)
  audit_schema: observability
  audit_table: pipeline_step_log
  # Per-table watermarks (production parity: control.watermark_table).
  # Recorded into observability.watermark_table after every successful run
  # for each incremental model listed here (model name -> watermark column).
  watermarks:
    slv_orders: last_modified_at
    dim_customers_history: valid_from
  # Circuit breaker for the data-quality quarantine (rows). Breaching it
  # fails the build (tests/assert_quarantine_threshold.sql). Tune down once
  # the known-issue baseline for the production source is established.
  quarantine_alert_threshold: 2000
  # Extra dates ('yyyy-MM-dd') treated as holidays by dim_date, on top of
  # the three fixed-date Indian national holidays baked into the model.
  holiday_dates: []

# Structured logging + audit table (see macros/logging.sql / observability.sql)
on-run-start:
  - "{{ create_audit_schema() }}"
  - "{{ create_audit_table() }}"
  - "{{ create_watermark_table() }}"
  - "{{ log_run_start() }}"
on-run-end:
  - "{{ log_run_end(results) }}"
  - "{{ record_watermarks(results) }}"

models:
  sales_analytics:
    +persist_docs:
      relation: true
      columns: true

    # Model-level logging: every model logs start/end automatically.
    +pre-hook: "{{ log_model_start() }}"
    +post-hook: "{{ log_model_end() }}"

    staging:
      +materialized: table
      +schema: bronze
      +tags: ['bronze']

    silver:
      +materialized: table
      +schema: silver
      +tags: ['silver']

    gold:
      +materialized: table
      +schema: gold
      +tags: ['gold']

      dim_customers_scd2:
        +materialized: view

    observability:
      +materialized: view
      +schema: "{{ var('audit_schema', 'observability') }}"
      +tags: ['observability']
