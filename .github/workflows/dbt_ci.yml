name: dbt CI

# Every pull request builds the whole project into the dev catalog.
# Nothing in this workflow can ever touch dbt_prod.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR supersedes the in-flight run.
concurrency:
  group: dbt-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DBT_TARGET: dev
  # Quality gate: fail if the run produces MORE warnings than this baseline.
  # Baseline is documented in docs/CI_CD.md#7-quality-gate.
  EXPECTED_WARNINGS: "5"

jobs:
  validate-and-build:
    name: dev build (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup dbt Fusion (pinned)
        uses: ./.github/actions/setup-dbt
        with:
          databricks-host: ${{ secrets.DATABRICKS_HOST }}
          databricks-http-path: ${{ secrets.DATABRICKS_HTTP_PATH }}
          databricks-token: ${{ secrets.DATABRICKS_TOKEN }}

      - name: dbt deps
        run: dbt deps --profiles-dir .

      # Cheap static validation first: YAML, refs, macros. Fails in seconds
      # instead of after a connection attempt.
      - name: dbt parse
        run: dbt parse --profiles-dir . --target "$DBT_TARGET"

      - name: dbt debug
        run: dbt debug --profiles-dir . --target "$DBT_TARGET"

      # `dbt build` = seed + snapshot + run + test, in DAG order.
      - name: dbt build
        run: dbt build --profiles-dir . --target "$DBT_TARGET"

      - name: Quality gate and summary
        if: always()
        run: |
          set -euo pipefail
          run_json=target/run_results.json

          if [ -f "$run_json" ]; then
            {
              echo "### dbt CI results (target ${DBT_TARGET})"
              echo ""
              echo "| status | count |"
              echo "|---|---|"
              jq -r '[.results[] | .status] | group_by(.)[] | "| \(.[0]) | \(length) |"' "$run_json"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No run_results.json produced."
            exit 0
          fi

          warn=$(jq '[.results[] | select(.status == "warn")] | length' "$run_json")
          bad=$(jq '[.results[] | select(.status == "error" or .status == "fail")] | length' "$run_json")
          echo "quality gate: warnings=$warn (baseline $EXPECTED_WARNINGS) failing=$bad"

          if [ "$bad" -gt 0 ]; then
            echo "::error title=Failing results::$bad dbt results have status error/fail. See the uploaded artifacts."
            exit 1
          fi
          if [ "$warn" -gt "$EXPECTED_WARNINGS" ]; then
            echo "::error title=Warning ceiling exceeded::$warn warnings exceeds the baseline of $EXPECTED_WARNINGS. Fix the new warning or consciously raise EXPECTED_WARNINGS in .github/workflows/dbt_ci.yml and dbt_deploy.yml (docs/CI_CD.md#7-quality-gate)."
            exit 1
          fi
          if [ "$warn" -lt "$EXPECTED_WARNINGS" ]; then
            echo "::warning title=Warning count improved::$warn warnings is below the baseline of $EXPECTED_WARNINGS. Lower EXPECTED_WARNINGS to lock in the new baseline."
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dbt-artifacts-dev-${{ github.run_id }}
          path: |
            target/manifest.json
            target/run_results.json
            target/catalog.json
            logs/
          if-no-files-found: ignore
          retention-days: 14
