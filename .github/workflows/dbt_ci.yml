name: dbt CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dbt-${{ github.ref }}
  cancel-in-progress: true

env:
  DBT_TARGET: ${{ github.event_name == 'push' && 'prod' || 'dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install dbt Fusion
        # Official install script; pin a version in production.
        run: |
          curl -fsSL https://public.cdn.getdbt.com/fs/install/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: dbt version
        run: dbt --version

      - name: dbt deps
        run: dbt deps --profiles-dir .

      - name: dbt debug
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: dbt debug --profiles-dir .

      - name: dbt build
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: dbt build --profiles-dir . --target "$DBT_TARGET"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts-${{ github.run_id }}
          path: |
            target/manifest.json
            target/run_results.json
            target/catalog.json
            logs/
          if-no-files-found: ignore
          retention-days: 14
